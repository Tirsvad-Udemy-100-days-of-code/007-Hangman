[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hangman"
version = "0.1.0"
description = "A beginner-friendly Hangman game for the terminal (Udemy 100 Days of Code, day 7)."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hangman = "hangman.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
